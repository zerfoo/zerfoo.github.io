baseURL: https://zerfoo.feza.ai/
languageCode: en-us
title: Zerfoo — AI inference. Native to Go.
theme: hugo-book

params:
  description: "Run language models inside your Go application. Open-source inference, GGUF loading, streaming, and serving. Apache 2.0."
  BookTheme: auto
  BookToC: true
  BookSection: docs
  BookLogo: /zerfoo.svg
  BookMenuBundle: /menu
  BookSearch: true
  BookDateFormat: January 2, 2006
  images:
    - /social-card.png

enableRobotsTXT: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: monokai
    lineNos: false

outputs:
  home:
    - HTML
    - RSS
  section:
    - HTML
    - RSS
