baseURL: https://zer.foo/
languageCode: en-us
title: Zerfoo — Build AI you own.
theme: hugo-book

params:
  description: "Create, train, evaluate and run AI on your own hardware. Open source. Apache 2.0."
  BookTheme: auto
  BookToC: true
  BookSection: docs
  BookLogo: /zerfoo.svg
  BookMenuBundle: /menu
  BookSearch: true
  BookDateFormat: January 2, 2006
  images:
    - /social-card.png

enableRobotsTXT: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: monokai
    lineNos: false

outputs:
  home:
    - HTML
    - RSS
  section:
    - HTML
    - RSS

security:
  allowContent:
    - text/html
    - text/org
    - text/markdown
